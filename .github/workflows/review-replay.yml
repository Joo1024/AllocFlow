name: review-replay
on:
  push:
    branches: [dev/allocflow-v0.1]
    paths:
      - 'src/**'
      - 'scripts/review_replay.py'
      - '.github/workflows/review-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
      - run: uv sync --locked --extra providers --extra web --extra scenarios --group dev
      - run: git worktree add --detach work/review-baseline 98532a48047362bd6aaa41a3f62214359c561151
      - run: uv run python scripts/review_replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-replay-evidence
          path: work/review-evidence
          retention-days: 30
